name: manual-training
# Training never runs on ordinary commits. A self-hosted runner with the data and (optionally) a GPU runs the
# DVC pipeline for an allowlisted recipe and uploads the evidence.
on:
  workflow_dispatch:
    inputs:
      recipe: {description: "allowlisted recipe id (configs/recipes)", required: true, default: nano_224}
jobs:
  train:
    runs-on: [self-hosted, treadops-train]
    steps:
      - uses: actions/checkout@v4
      - run: uv sync --locked
      - run: test -f "configs/recipes/${{ inputs.recipe }}.yaml"
      - run: uv run dvc pull && uv run dvc repro && uv run dvc push
      - run: uv run python scripts/evidence.py
      - uses: actions/upload-artifact@v4
        with: {name: training-evidence, path: "docs/evidence/**"}
