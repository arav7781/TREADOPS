# Data acquisition + canonicalisation contract (stage: prepare)
schema_version: 1
source:
  id: "D1:v1"
  name: "Digital images of defective and good condition tyres"
  doi: "10.17632/bn7ch8tvyp.1"
  url: "https://data.mendeley.com/datasets/bn7ch8tvyp/1"
  license: "CC BY 4.0"
  attribution: "Pathmanaban P. et al., Mendeley Data, V1, doi:10.17632/bn7ch8tvyp.1"
  receipt: docs/evidence/data/download_receipt.json
archive: data/raw/archive/bn7ch8tvyp-1.zip
# More public tyre photographs from other places, cameras and light (`make fetch-data` downloads them too). Each
# source is split on its own, so D1's roles, including its locked test, stay exactly as they were.
extra_sources:
  - id: "TYRENET:v1"
    name: "TyreNet: A High-quality Annotated Dataset for Tyre Defect Classification with Deep Learning Models"
    doi: "10.17632/32b5vfj6tc.1"
    url: "https://data.mendeley.com/datasets/32b5vfj6tc/1"
    license: "CC BY 4.0"
    attribution: "Mahendrada V. S., Parameswaran M., Mendeley Data, V1, doi:10.17632/32b5vfj6tc.1"
    capture: "Android phone (48 MP) at six car and bike service stations and two tyre showrooms"
    endpoint: "https://data.mendeley.com/public-files/datasets/32b5vfj6tc/files/34bae407-28f3-4728-ba58-3c7fd50817ea/file_downloaded"
    archive: data/raw/archive/tyrenet-32b5vfj6tc-1.rar
    archive_sha256: d6a6946a3452c53c787578e740652a6fa0876e26d42197183aaf967f93847014
    label_map: {defective: defective, good: good}
  - id: "MSU:v1"
    name: "Oxidized and non-oxidized tire sidewall and tread images"
    doi: "10.7910/DVN/Z3ZYLI"
    url: "https://dataverse.harvard.edu/dataset.xhtml?persistentId=doi:10.7910/DVN/Z3ZYLI"
    license: "CC0 1.0"
    attribution: "Siegel J. E. et al., Michigan State University, Harvard Dataverse, doi:10.7910/DVN/Z3ZYLI"
    capture: "phone photos of sidewalls and treads in the USA; cracked (oxidised) or normal rubber"
    endpoint: "https://dataverse.harvard.edu/api/access/datafile/5118474"
    archive: data/raw/archive/msu-z3zyli.tar.gz
    archive_md5: 92127aa4e8d475628444e9da823f2832
    label_map: {cracked: defective, normal: good}
extracted_dir: data/raw/extracted
processed_dir: data/processed
manifest_dir: data/manifests
quarantine_dir: data/quarantine
limits:
  max_file_bytes: 26214400        # 25 MiB per source image
  max_decoded_pixels: 25000000    # decompression-bomb guard (matches MAX_DECODED_PIXELS)
  min_side: 64
allowed_suffixes: [".jpg", ".jpeg", ".png"]
canonical:
  max_side: 1024                  # long side after EXIF transpose; never upscaled
  resample: LANCZOS
  format: JPEG
  quality: 95
  subsampling: 0                  # 4:4:4 chroma
label_map:                        # archive folder (lower-cased) -> semantic label
  defective: defective
  good: good
duplicates:                       # rules set after a visual review of candidate pairs (docs/adr/0003-*.md)
  phash_hamming_max: 6
  phash_requires_cosine_min: 0.85 # pHash alone produced false matches between different tyres
  embedding_cosine_min: 0.90      # 0.90-0.98 pairs were the same physical tyre re-photographed
  sequence_index_distance_max: 3  # publisher capture order: adjacent shots of one tyre ...
  sequence_cosine_min: 0.80       # ... grouped when also visually similar
  review_floor: 0.86              # pairs above this (or near pHash) are listed in duplicate_review.csv
