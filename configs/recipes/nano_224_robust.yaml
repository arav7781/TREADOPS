id: nano_224_robust
model: yolo26n-cls.pt
epochs: 60
imgsz: 224
batch: 16
optimizer: AdamW
lr0: 0.001
patience: 12
seed: 42
workers: 2
# Same as nano_224 plus low-light, blur and JPEG augmentation (the stress tests' weak spots).
augment: {hflip: 0.5, vflip: 0.0, rotate_deg: 10, brightness: 0.2, contrast: 0.2, saturation: 0.2, low_light: 0.3, blur: 0.2, jpeg: 0.2}
