[project]
name = "treadops"
version = "0.1.0"
description = "TreadOps: YOLO tyre-casing inspection with an end-to-end MLOps + LLMOps loop and a circularity copilot"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "AGPL-3.0-only" }
authors = [
  { name = "Arav Saxena" },
  { name = "Mahi Laddha" },
]
dependencies = [
  "ultralytics==8.4.183",
  "torch==2.14.1",
  "torchvision==0.29.1",
  "onnx==1.23.2",
  "onnxslim",
  "onnxruntime==1.31.0",
  "fastapi",
  "uvicorn[standard]",
  "sqlalchemy",
  "alembic",
  "psycopg[binary]",
  "celery[redis]",
  "redis",
  "boto3",
  "pillow",
  "numpy",
  "pandas>=2.2,<3",  # evidently 0.7.23 imports pandas internals removed in 3.0
  "pyarrow",
  "scipy",
  "scikit-learn",
  "mlflow==3.17.2",
  "dvc[s3]",
  "evidently==0.7.23",
  "python-multipart",
  "pyjwt",
  "pyyaml",
  "pydantic",
  "pydantic-settings",
  "httpx",
  "openai>=1.55",
  "langgraph==1.2.16",
]

[dependency-groups]
dev = [
  "pytest",
  "pytest-asyncio",
  "pytest-timeout",
  "ruff",
  "mypy",
  "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "packages/treadops_ml/treadops_ml",
  "packages/treadops_agent/treadops_agent",
  "services/api/treadops_api",
  "services/worker/treadops_worker",
]

[tool.uv]
package = true

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["apps", "data", "runs", "artifacts", "models", "migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008", "SIM108"]

[tool.ruff.lint.isort]
known-first-party = ["treadops_ml", "treadops_api", "treadops_worker", "treadops_agent"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = false
packages = ["treadops_ml", "treadops_api", "treadops_worker", "treadops_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: needs PostgreSQL/Redis/MinIO from the Compose test profile",
  "ml: needs real model weights or the real dataset",
  "slow: long-running",
]
addopts = "-ra"
timeout = 600

# Linux containers use CPU-only torch wheels (the CUDA build adds ~3-4 GB); macOS keeps the PyPI build (MPS).
# The optional NVIDIA training image installs the matching CUDA wheel at build time (see infra/docker).
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
